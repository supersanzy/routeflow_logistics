models:
  - name: dim_carrier
    columns:
      - name: carrier_key
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: carrier
        data_tests:
          - not_null:
              config:
                severity: error

  - name: dim_location
    columns:
      - name: location_key
        data_tests:
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: city
        data_tests:
          - not_null:
              config:
                severity: error

      - name: country
        data_tests:
          - not_null:
              config:
                severity: error

  - name: dim_status
    columns:
      - name: status_key
        data_tests:
          - unique:
              config:
                severity: error
          - not_null

      - name: status
        data_tests:
          - not_null:
              config:
                severity: error

  - name: dim_status_reason
    columns:
      - name: status_reason_key
        data_tests: 
          - not_null:
              config:
                severity: error
          - unique:
              config:
                severity: error

      - name: status_reason
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: dim_date
    

