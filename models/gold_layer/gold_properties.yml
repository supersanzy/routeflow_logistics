          - relationships:
              arguments:
                to: ref('dim_status_reason')
                field: status_reason_key
              config:
                severity: error

      - name: origin_key
        data_tests:
          - not_null:
              config:
                severity: error
                    
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
              config:
                severity: error

      - name: destination_key
        data_tests:
          - not_null:
              config:
                severity: error

          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key
              config:
                severity: error

      - name: carrier_key
        data_tests:
          - not_null:
              config:
                severity: error

          - relationships:
              arguments:
                to: ref('dim_carrier')
                field: carrier_key

      - name: shipping_cost
        data_tests:
          - not_null:
              config:
                severity: error

      - name: created_at

      - name: updated_at
            

            
                


            
             






