        data_tests:
            - not_null:
                config:
                  severity: error
            - unique:
                config:
                  severity: error

      - name: shipment_date
        data_tests:
            - not_null:
                  config:
                    severity: error

      - name: delivery_date

      - name: shipment_date_key
        data_tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: delivery_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
            
      - name: status_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_status')
                field: status_key
              config:
                severity: error

      - name: status_reason_key
        data_tests:
          - not_null:
              config:
